<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seul Hangıl Hattı</title>
<meta name="description" content="Seul gezisi için Hangıl okuma pratiği: metro, market, yemek; gerçek fotoğraflar ve videolu dersler.">
<style>*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@700&family=Do+Hyeon&family=Black+Han+Sans&display=swap">
<style>
/* Layout: a Seoul subway map. Each level is a numbered metro line, each round a station; lessons run on one centered card. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202a; --muted:#5d6b78; --line:#d9dfe5;
  --ok:#0a8a4a; --ok-bg:#e3f5ea; --bad:#c9372c; --bad-bg:#fbe7e5;
  --l2:#00a84d; --l3:#ef7c1c; --l4:#00a4e3; --l5:#996cac; --l1:#0052a4; --l9:#a08f4f;
  --hangul:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2128; --fg:#e8edf2; --muted:#9aa7b3; --line:#2c353e;
  --ok:#3fcf82; --ok-bg:#16352a; --bad:#ff7a6e; --bad-bg:#3a1f1d; --l1:#4d8fe0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2128; --fg:#e8edf2; --muted:#9aa7b3; --line:#2c353e;
  --ok:#3fcf82; --ok-bg:#16352a; --bad:#ff7a6e; --bad-bg:#3a1f1d; --l1:#4d8fe0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 span{font-family:var(--hangul);font-weight:700}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.lbl{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--l4);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--fg);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}

/* map */
.line{background:var(--surface);border-radius:14px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.line-head{display:flex;align-items:center;gap:10px}
.badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--mono);flex:none}
.line-head h2{margin:0;font-size:1.05rem}
.line-head p{margin:0;color:var(--muted);font-size:.85rem}
.track{position:relative;display:flex;gap:8px;overflow-x:auto;padding:6px 2px 4px}
.track::before{content:"";position:absolute;left:24px;right:24px;top:22px;height:6px;border-radius:3px;background:var(--c)}
.stop{position:relative;flex:1 0 96px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;text-align:center}
.dot{width:38px;height:38px;border-radius:50%;background:var(--surface);border:6px solid var(--c);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--c)}
.stop.done .dot{background:var(--c);color:#fff}
.stop .nm{font-size:.85rem;font-weight:600;line-height:1.25}
.stop .hw{font-family:var(--hangul);color:var(--muted);font-size:.85rem}
.review{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.review p{margin:0;font-size:.9rem;color:var(--muted);min-width:0;flex:1 1 220px}

/* lesson */
.bar{display:flex;align-items:center;gap:12px}
.bar .x{background:none;border:0;font-size:1.4rem;line-height:1;padding:4px 8px;color:var(--muted)}
.prog{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.big{font-family:var(--hangul);font-weight:500;font-size:clamp(4.5rem,22vw,8.5rem);line-height:1.1;letter-spacing:.02em;word-break:keep-all}
.big.long{font-size:clamp(2.6rem,11vw,4.6rem)}
.roman{font-family:var(--mono);font-size:1.35rem}
.mean{font-size:1.1rem;font-weight:600}
.note{color:var(--muted);font-size:.95rem;max-width:46ch;margin:0}
.speak{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600}
.speak svg{width:18px;height:18px}
.q{font-weight:600;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 10px;font-family:var(--mono);font-size:1.05rem;min-height:56px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt:disabled{cursor:default}
.opt .k{font-size:.7rem;color:var(--muted);margin-right:6px}
.fb{min-height:1.5em;margin:0;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.prog i{transition:none}}
.warn{font-size:.85rem;color:var(--bad);margin:0}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin:0}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
/* tools row */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tool{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.88rem;color:var(--muted);min-width:0}
.tool b{color:var(--fg);font-size:.98rem}
.tool:disabled{opacity:.5;cursor:default}
.tool:hover:not(:disabled){border-color:var(--fg)}
.ti{font-family:var(--hangul);font-weight:700;color:var(--fg);font-size:1.05rem;white-space:nowrap;flex:none}
@media (max-width:520px){.tools{grid-template-columns:1fr}}
/* breakdown tiles */
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;min-width:72px;transition:transform .15s,border-color .15s}
.tile.on{border-color:var(--c);transform:translateY(-3px)}
.ts{font-family:var(--hangul);font-size:1.9rem;font-weight:500;line-height:1.2}
.tj{font-family:var(--hangul);font-size:.9rem;color:var(--muted)}
.tr{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.tiny{font-size:.78rem;color:var(--muted);margin:0;max-width:46ch}
.real{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center}
.real a,a.speak{color:var(--fg);text-decoration:none;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.real a{border-bottom:2px solid var(--c);padding-bottom:1px}
.bigspeak{width:120px;height:120px;border-radius:50%;border:0;background:var(--c);color:#fff;display:grid;place-items:center}
.bigspeak svg{width:56px;height:56px}
.opts.hangul .opt{font-family:var(--hangul);font-size:1.7rem}
/* signs: each is a self-contained object with its own fixed colors */
.sign{border-radius:10px;padding:14px 22px;max-width:100%}
.sign .big{display:block}
.sign-metro{background:#1d2a3a;color:#fff;border-bottom:8px solid var(--c);font-family:var(--hangul)}
.sign-metro .big{font-weight:700}
.sign-store{background:#4b2a8a;color:#fff;border-radius:6px;box-shadow:inset 0 -10px 0 #6fd2c4}
.sign-store .big{font-family:"Do Hyeon",var(--hangul);font-weight:400}
.sign-menu{background:#2f3a33;color:#f4f1e6;border:6px solid #8a6a45}
.sign-menu .big{font-family:"Nanum Pen Script",cursive;font-weight:400;font-size:clamp(5rem,26vw,9.5rem)}
.sign-menu .big.long{font-size:clamp(3.2rem,14vw,5.6rem)}
.sign-serif{background:#fbf8f1;color:#222;border:1px solid #d8d0c0}
.sign-serif .big{font-family:"Nanum Myeongjo",serif;font-weight:700}
.sign-poster{background:#ffd400;color:#111}
.sign-poster .big{font-family:"Black Han Sans",var(--hangul);font-weight:400}
/* lab */
.grp{width:100%;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;min-width:46px;padding:6px 6px 4px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px}
.chip b{font-family:var(--hangul);font-size:1.25rem;font-weight:500;line-height:1.2}
.chip small{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.chip.sel{border-color:var(--c);background:var(--c);color:#fff}
.chip.sel small{color:#fff}
.okc{color:var(--ok)}
.ph{margin:0;width:100%;border-radius:12px;overflow:hidden;background:var(--line)}
.ph img{display:block;width:100%;max-height:52vh;object-fit:contain;background:#000}
.vid{width:100%;display:flex;flex-direction:column;gap:8px}
.vbtn{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;color:#c4302b;font-weight:600}
.vbtn span{color:var(--fg);font-size:.95rem;line-height:1.3}
.vbtn small{color:var(--muted);font-weight:400}
.vframe{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.credits{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.85rem;color:var(--muted)}
.credits summary{cursor:pointer;font-weight:600;color:var(--fg)}
.credits ul{padding-left:18px;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.credits a{color:var(--fg);overflow-wrap:anywhere}
</style>

</head>

/* ---------- hangul math: syllable = 0xAC00 + (initial*21 + vowel)*28 + final ---------- */
const CHO=[..."ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ"];
const CHO_R=["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
const JUNG=[..."ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ"];
const JUNG_R=["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
const JONG=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JONG_R=["","k","k","k","n","n","n","t","l","k","m","l","l","l","p","l","m","p","p","t","t","ng","t","t","k","t","p","t"];
const isSyl=ch=>{const c=ch.charCodeAt(0);return c>=0xAC00&&c<=0xD7A3};
function decomp(ch){const c=ch.charCodeAt(0)-0xAC00;return{l:Math.floor(c/588),v:Math.floor(c%588/28),t:c%28}}
const compose=(l,v,t)=>String.fromCharCode(0xAC00+(l*21+v)*28+t);
const sylRoman=ch=>{const d=decomp(ch);return CHO_R[d.l]+JUNG_R[d.v]+JONG_R[d.t]};
const syllables=w=>[...w].filter(isSyl);

const $=s=>document.querySelector(s);
const app=$("#app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rid=(li,ri)=>LINES[li].n+"-"+ri;
const SWAPS=[["eo","u"],["eo","o"],["o","u"],["u","eo"],["wo","wi"],["wi","wo"],["eu","u"],["ng","n"],["h",""]];
function fake(r,taken){for(const [a,b] of shuffle(SWAPS)){if(r.includes(a)){const f=r.replace(a,b);if(f&&!taken.has(f))return f}}return null}
function options(item,pool){
  const taken=new Set([item.r]);const out=[item.r];
  const f=fake(item.r,taken);if(f){out.push(f);taken.add(f)}
  for(const p of shuffle(pool)){if(out.length>=4)break;if(!taken.has(p.r)){out.push(p.r);taken.add(p.r)}}
  return shuffle(out);
}
/* listening distractors: a look-alike made by swapping one vowel, then other words */
const VSWAP={4:[8,13],8:[4,13],13:[4,18],18:[13],14:[16],16:[14],9:[14],0:[4]};
function fakeHangul(w){
  const s=[...w];const idx=shuffle(s.map((c,i)=>i).filter(i=>isSyl(s[i])));
  for(const i of idx){const d=decomp(s[i]);const alt=VSWAP[d.v];if(alt){s[i]=compose(d.l,alt[Math.random()*alt.length|0],d.t);return s.join("")}
    if(d.l===11||d.l===18){s[i]=compose(d.l===11?18:11,d.v,d.t);return s.join("")}}
  return null;
}
function hOptions(item,pool){
  const out=[item.h];const f=fakeHangul(item.h);if(f&&f!==item.h)out.push(f);
  for(const p of shuffle(pool)){if(out.length>=4)break;if(!out.includes(p.h))out.push(p.h)}
  return shuffle(out);
}

}
function startReview(){
  const all=[];LINES.forEach((Ln,li)=>Ln.rounds.forEach((R,ri)=>{if(S.done[rid(li,ri)])R.items.forEach(it=>all.push({...it,c:Ln.c}))}));
  const uniq=[...new Map(all.map(i=>[i.h+(i.img||""),i])).values()];
  const sorted=shuffle(uniq).sort((a,b)=>(S.miss[b.h]||0)-(S.miss[a.h]||0));
  const q=shuffle(sorted.slice(0,12).map((it,i)=>({...it,mode:it.ask==="pick"?"pick":(HAS_TTS&&!it.img&&i%3===2?"listen":"read")})));
  setColor("--l2");
  L={title:"Karışık tekrar",items:q,pool:uniq,stage:"quiz",queue:q.slice(),total:q.length,right:0,wrong:0,review:true};
  render();
}
function topbar(done,total,title){
  return `<div class="bar"><button class="x" id="quit" aria-label="Haritaya dön">×</button><div class="prog"><i style="width:${Math.min(100,Math.round(done/total*100))}%"></i></div><span class="lbl">${esc(title)}</span></div>`;
}
function render(){({intro,learn,quiz,end})[L.stage]()}
function bindQuit(){$("#quit").onclick=home}
function intro(){
  app.innerHTML=`${topbar(0,1,L.title)}
   <div class="card"><span class="lbl">Yeni durak</span><div class="big long">${esc(L.hw)}</div>
   <p class="note">${esc(L.tip)}</p><p class="note">Önce ${L.items.length} kelimeyle tanışacaksın: hece hece dinleyip gerçek videolarda duyabilirsin. Sonra okuma ve dinleme soruları gelecek. Yanlış yaptıkların tekrar karşına çıkar.</p>
   ${videoBlock(L.vid)}
   <div class="row"><button class="btn" id="go">Başla</button><button class="btn ghost" id="skip">Doğrudan teste geç</button></div></div>`;
  bindQuit();bindVideo();
  $("#go").onclick=()=>{L.stage="learn";render()};
  $("#skip").onclick=()=>{L.stage="quiz";render()};
  $("#go").focus();
}
function learn(){
  const it=L.items[L.learnI];
  app.innerHTML=`${topbar(L.learnI,L.items.length*2,L.title)}
   <div class="card"><span class="lbl">Tanış · ${L.learnI+1}/${L.items.length}</span>
    ${figure(it)}
    <div class="big ${it.h.length>3?"long":""}">${esc(it.h)}</div>
    <div class="row"><button class="speak" id="sp">${SPK}Dinle</button><button class="speak" id="slow">${SPK}Hece hece</button></div>
    <div class="roman">${esc(it.r)}</div><div class="mean">${esc(it.m)}</div><p class="note">${esc(it.n)}</p>
    ${breakdown(it.h)}
    ${videoBlock(it.vid||L.vid)}
    ${realLinks(it.h)}
    <div class="row"><button class="btn ghost" id="back" ${L.learnI?"":"disabled"}>Geri</button><button class="btn" id="next">${L.learnI<L.items.length-1?"Sonraki":"Teste geç"}</button></div></div>`;
  bindQuit();bindTiles();bindVideo();
  $("#sp").onclick=()=>say(it.h);
  $("#slow").onclick=playSlow;
  $("#back").onclick=()=>{L.learnI--;render()};
  $("#next").onclick=()=>{if(L.learnI<L.items.length-1)L.learnI++;else L.stage="quiz";render()};
  say(it.h);$("#next").focus();
}
function quiz(){
  if(!L.queue.length){L.stage="end";return render()}
  const it=L.queue[0];if(it.c)setColor(it.c);
  const listen=it.mode==="listen", pickM=it.mode==="pick", hangulOpts=listen||pickM;
  const pool=pickM?L.pool.filter(p=>p.ask==="pick").concat(L.pool):L.pool;
  const opts=hangulOpts?hOptions(it,pool):options(it,L.pool);
  const style=(hangulOpts||it.img)?null:(L.review||Math.random()<.5?SIGNS[1+(Math.random()*(SIGNS.length-1)|0)]:SIGNS[0]);
  const answered=L.total-L.queue.length;
  app.innerHTML=`${topbar(L.review?answered:L.items.length+answered,L.review?L.total:L.items.length+L.total,L.title)}
   <div class="card" id="card">
    ${listen?`<span class="lbl">Dinle · hangisi?</span><button class="bigspeak" id="ls" aria-label="Tekrar dinle">${SPK}</button><p class="note">Duyduğun kelimenin yazılışını seç.</p>`
      :it.img?`<span class="lbl">Gerçek fotoğraf</span>${figure(it)}<p class="q">${esc(it.q)}</p>`
      :`<span class="lbl">Nasıl okunur?${style.k!=="plain"?" · "+style.n:""}</span>${signHTML(it.h,style)}`}
    <div class="opts ${hangulOpts?"hangul":""}">${opts.map((o,i)=>`<button class="opt" data-v="${esc(o)}"><span class="k">${i+1}</span>${esc(o)}</button>`).join("")}</div>
    <p class="fb" id="fb" aria-live="polite"></p><div id="after"></div></div>`;
  bindQuit();
  if(listen){say(it.h);$("#ls").onclick=()=>say(it.h)}
  const answer=hangulOpts?it.h:it.r;
  const btns=[...app.querySelectorAll(".opt")];
  const pick=b=>{
    if(b.disabled)return;btns.forEach(x=>x.disabled=true);
    const ok=b.dataset.v===answer;
    btns.find(x=>x.dataset.v===answer).classList.add("ok");
    say(it.h);
    if(ok){
      L.right++;b.classList.add("ok");
      $("#fb").className="fb ok";$("#fb").textContent=`Doğru! ${hangulOpts?it.h+" · "+it.r:it.m}`;
      if(S.miss[it.h])S.miss[it.h]=Math.max(0,S.miss[it.h]-1);save();
      L.queue.shift();
      setTimeout(()=>{if(L&&L.stage==="quiz"&&L.queue[0]!==it)quiz()},1200);
    }else{
      L.wrong++;b.classList.add("bad");$("#card").classList.add("shake");
      S.miss[it.h]=(S.miss[it.h]||0)+1;save();
      $("#fb").className="fb bad";$("#fb").textContent=`Doğrusu: ${it.h} · ${it.r} · ${it.m}`;
      $("#after").innerHTML=`<p class="note">${esc(it.n)}</p>${breakdown(it.h)}<div class="row" style="margin-top:12px"><button class="speak" id="slow">${SPK}Hece hece</button><a class="speak" href="${yg(it.h)}" target="_blank" rel="noopener">${EXT}Videoda duy</a><button class="btn" id="cont">Devam</button></div>${videoBlock(it.vid||L.vid)}`;
      bindTiles($("#after"));bindVideo($("#after"));$("#slow").onclick=playSlow;
      const again=L.queue.shift();L.queue.splice(Math.min(2,L.queue.length),0,again);L.total++;
      $("#cont").onclick=quiz;$("#cont").focus();
    }
  };
  btns.forEach(b=>b.onclick=()=>pick(b));
  document.onkeydown=e=>{if(L&&L.stage==="quiz"&&/^[1-4]$/.test(e.key)&&btns[e.key-1])pick(btns[e.key-1])};
}
function end(){
  document.onkeydown=null;
  if(!L.review){S.done[rid(L.li,L.ri)]=true;save()}
  const acc=Math.round(L.right/Math.max(1,L.right+L.wrong)*100);
  const Ln=L.review?null:LINES[L.li];const nextR=Ln&&Ln.rounds[L.ri+1];
  const nextL=Ln&&!nextR&&LINES[L.li+1];
  app.innerHTML=`${topbar(1,1,L.title)}
   <div class="card"><span class="lbl">${L.review?"Tekrar bitti":"Durak tamam"}</span>
    ${L.review?"":`${signHTML(L.hw,SIGNS[1])}<p class="note">Bu kelimeyi artık tabelada da okuyabilirsin.</p><div class="row"><button class="speak" id="sp">${SPK}Dinle</button></div>${realLinks(L.hw)}`}
    <div class="mean">${L.right} doğru, ${L.wrong} yanlış · %${acc}</div>
    <p class="note">${L.wrong?"Yanlış yaptıkların karışık tekrarda önce gelecek.":"Hiç yanlış yok, harika."}</p>
    <div class="row">
     ${nextR?`<button class="btn" id="nx">Sonraki durak: ${esc(nextR.name)}</button>`:""}
     ${nextL?`<button class="btn" id="nl">Sonraki hat: ${esc(nextL.name)}</button>`:""}
     <button class="btn ghost" id="map">Haritaya dön</button></div></div>`;
  bindQuit();
  if(!L.review){$("#sp").onclick=()=>say(L.hw);say(L.hw)}
  if(nextR)$("#nx").onclick=()=>startRound(L.li,L.ri+1);
  if(nextL)$("#nl").onclick=()=>startRound(L.li+1,0);
  $("#map").onclick=home;
}

/* ---------- syllable lab ---------- */
const LAB_FINALS=[0,1,4,8,16,17,19,21];
let LB={l:18,v:9,t:0,task:null,score:0};
function labTargets(){const s=new Set();LINES.forEach(Ln=>Ln.rounds.forEach(R=>R.items.forEach(it=>syllables(it.h).forEach(c=>{const d=decomp(c);if(LAB_FINALS.includes(d.t))s.add(c)}))));return[...s]}
function newTask(){const ts=labTargets();LB.task=ts[Math.random()*ts.length|0];LB.l=11;LB.v=0;LB.t=0;}
function lab(){
  setColor("--l5");document.onkeydown=null;
  const cur=compose(LB.l,LB.v,LB.t);
  const chips=(arr,rom,sel,key,list)=>list.map(i=>`<button class="chip ${i===sel?"sel":""}" data-k="${key}" data-i="${i}"><b>${arr[i]||"yok"}</b><small>${key==="l"&&i===11?"sessiz":(rom[i]||"–")}</small></button>`).join("");
  const done=LB.task&&cur===LB.task;
  app.innerHTML=`${topbar(LB.score%5,5,"Hece atölyesi")}
   <div class="card">
    <div class="row"><button class="btn ${LB.task?"ghost":""}" id="free">Serbest</button><button class="btn ${LB.task?"":"ghost"}" id="task">Görev: duyduğunu kur</button></div>
    ${LB.task?`<p class="note">${done?"Doğru! ":""}Duyduğun heceyi aşağıdaki harflerle kur. <button class="speak" id="tp">${SPK}Tekrar dinle</button> Kurulan: ${LB.score}</p>`:`<p class="note">İlk ünsüz + ünlü + (isteğe bağlı) son ünsüz seç. Her değişiklikte hece okunur.</p>`}
    <div class="big ${done?"okc":""}">${cur}</div>
    <div class="roman">${esc(sylRoman(cur))}</div>
    <div class="tj">${[CHO[LB.l],JUNG[LB.v],JONG[LB.t]].filter(Boolean).join(" + ")}</div>
    <div class="grp"><span class="lbl">1 · İlk ünsüz</span><div class="chips">${chips(CHO,CHO_R,LB.l,"l",CHO.map((_,i)=>i))}</div></div>
    <div class="grp"><span class="lbl">2 · Ünlü</span><div class="chips">${chips(JUNG,JUNG_R,LB.v,"v",JUNG.map((_,i)=>i))}</div></div>
    <div class="grp"><span class="lbl">3 · Son ünsüz (받침)</span><div class="chips">${chips(JONG,JONG_R,LB.t,"t",LAB_FINALS)}</div></div>
    ${done?`<button class="btn" id="nt">Sıradaki hece</button>`:LB.task?`<button class="btn ghost" id="show">Göster</button>`:""}
   </div>`;
  bindQuit();
  app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{LB[c.dataset.k]=+c.dataset.i;const s=compose(LB.l,LB.v,LB.t);
    if(LB.task&&s===LB.task)LB.score++;lab();say(s,{rate:.7})});
  $("#free").onclick=()=>{LB.task=null;lab()};
  $("#task").onclick=()=>{newTask();lab();say(LB.task,{rate:.7})};
  if($("#tp"))$("#tp").onclick=()=>say(LB.task,{rate:.7});
  if($("#nt"))$("#nt").onclick=()=>{newTask();lab();say(LB.task,{rate:.7})};
  if($("#show"))$("#show").onclick=()=>{const d=decomp(LB.task);LB.l=d.l;LB.v=d.v;LB.t=d.t;lab();say(LB.task,{rate:.7})};
}
home();
</script>
