<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seul Hangıl Hattı</title>
<meta name="description" content="Seul gezisi için Hangıl okuma pratiği: metro, market, yemek, sayılar ve cümleler; gerçek fotoğraflar, videolu dersler, tekrar sistemi ve oyunlar.">
<style>*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@700&family=Do+Hyeon&family=Black+Han+Sans&display=swap">
<style>
/* Layout: a Seoul subway map. Each level is a numbered metro line, each round a station; lessons run on one centered card. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202a; --muted:#5d6b78; --line:#d9dfe5;
  --ok:#0a8a4a; --ok-bg:#e3f5ea; --bad:#c9372c; --bad-bg:#fbe7e5;
  --l2:#00a84d; --l3:#ef7c1c; --l4:#00a4e3; --l5:#996cac; --l1:#0052a4; --l6:#cd7c2f; --l7:#747f00; --l8:#e6186c; --l9:#a08f4f;
  --hangul:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2128; --fg:#e8edf2; --muted:#9aa7b3; --line:#2c353e;
  --ok:#3fcf82; --ok-bg:#16352a; --bad:#ff7a6e; --bad-bg:#3a1f1d; --l1:#4d8fe0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2128; --fg:#e8edf2; --muted:#9aa7b3; --line:#2c353e;
  --ok:#3fcf82; --ok-bg:#16352a; --bad:#ff7a6e; --bad-bg:#3a1f1d; --l1:#4d8fe0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 span{font-family:var(--hangul);font-weight:700}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.lbl{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--l4);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--fg);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}

/* map */
.line{background:var(--surface);border-radius:14px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.line-head{display:flex;align-items:center;gap:10px}
.badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--mono);flex:none}
.line-head h2{margin:0;font-size:1.05rem}
.line-head p{margin:0;color:var(--muted);font-size:.85rem}
.track{position:relative;display:flex;gap:8px;overflow-x:auto;padding:6px 2px 4px}
.track::before{content:"";position:absolute;left:24px;right:24px;top:22px;height:6px;border-radius:3px;background:var(--c)}
.stop{position:relative;flex:1 0 96px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;text-align:center}
.dot{width:38px;height:38px;border-radius:50%;background:var(--surface);border:6px solid var(--c);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--c)}
.stop.done .dot{background:var(--c);color:#fff}
.stop .nm{font-size:.85rem;font-weight:600;line-height:1.25}
.stop .hw{font-family:var(--hangul);color:var(--muted);font-size:.85rem}
.review{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.review p{margin:0;font-size:.9rem;color:var(--muted);min-width:0;flex:1 1 220px}

/* lesson */
.bar{display:flex;align-items:center;gap:12px}
.bar .x{background:none;border:0;font-size:1.4rem;line-height:1;padding:4px 8px;color:var(--muted)}
.prog{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.big{font-family:var(--hangul);font-weight:500;font-size:clamp(4.5rem,22vw,8.5rem);line-height:1.1;letter-spacing:.02em;word-break:keep-all}
.big.long{font-size:clamp(2.6rem,11vw,4.6rem)}
.roman{font-family:var(--mono);font-size:1.35rem}
.mean{font-size:1.1rem;font-weight:600}
.note{color:var(--muted);font-size:.95rem;max-width:46ch;margin:0}
.speak{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600}
.speak svg{width:18px;height:18px}
.q{font-weight:600;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 10px;font-family:var(--mono);font-size:1.05rem;min-height:56px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt:disabled{cursor:default}
.opt .k{font-size:.7rem;color:var(--muted);margin-right:6px}
.fb{min-height:1.5em;margin:0;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.prog i{transition:none}}
.warn{font-size:.85rem;color:var(--bad);margin:0}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin:0}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
/* tools row */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tool{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.88rem;color:var(--muted);min-width:0}
.tool b{color:var(--fg);font-size:.98rem}
.tool:disabled{opacity:.5;cursor:default}
.tool:hover:not(:disabled){border-color:var(--fg)}
.ti{font-family:var(--hangul);font-weight:700;color:var(--fg);font-size:1.05rem;white-space:nowrap;flex:none}
@media (max-width:520px){.tools{grid-template-columns:1fr}}
/* breakdown tiles */
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;min-width:72px;transition:transform .15s,border-color .15s}
.tile.on{border-color:var(--c);transform:translateY(-3px)}
.ts{font-family:var(--hangul);font-size:1.9rem;font-weight:500;line-height:1.2}
.tj{font-family:var(--hangul);font-size:.9rem;color:var(--muted)}
.tr{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.tiny{font-size:.78rem;color:var(--muted);margin:0;max-width:46ch}
.real{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center}
.real a,a.speak{color:var(--fg);text-decoration:none;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.real a{border-bottom:2px solid var(--c);padding-bottom:1px}
.bigspeak{width:120px;height:120px;border-radius:50%;border:0;background:var(--c);color:#fff;display:grid;place-items:center}
.bigspeak svg{width:56px;height:56px}
.opts.hangul .opt{font-family:var(--hangul);font-size:1.7rem}
/* signs: each is a self-contained object with its own fixed colors */
.sign{border-radius:10px;padding:14px 22px;max-width:100%}
.sign .big{display:block}
.sign-metro{background:#1d2a3a;color:#fff;border-bottom:8px solid var(--c);font-family:var(--hangul)}
.sign-metro .big{font-weight:700}
.sign-store{background:#4b2a8a;color:#fff;border-radius:6px;box-shadow:inset 0 -10px 0 #6fd2c4}
.sign-store .big{font-family:"Do Hyeon",var(--hangul);font-weight:400}
.sign-menu{background:#2f3a33;color:#f4f1e6;border:6px solid #8a6a45}
.sign-menu .big{font-family:"Nanum Pen Script",cursive;font-weight:400;font-size:clamp(5rem,26vw,9.5rem)}
.sign-menu .big.long{font-size:clamp(3.2rem,14vw,5.6rem)}
.sign-serif{background:#fbf8f1;color:#222;border:1px solid #d8d0c0}
.sign-serif .big{font-family:"Nanum Myeongjo",serif;font-weight:700}
.sign-poster{background:#ffd400;color:#111}
.sign-poster .big{font-family:"Black Han Sans",var(--hangul);font-weight:400}
/* lab */
.grp{width:100%;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;min-width:46px;padding:6px 6px 4px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px}
.chip b{font-family:var(--hangul);font-size:1.25rem;font-weight:500;line-height:1.2}
.chip small{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.chip.sel{border-color:var(--c);background:var(--c);color:#fff}
.chip.sel small{color:#fff}
.okc{color:var(--ok)}
/* v3 additions */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.stats b{font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:.78rem;color:var(--muted)}
.tool.hero{grid-column:1/-1;border-color:var(--l2);border-width:2px}
.tool.hero .ti{font-family:var(--mono);font-size:1.3rem;color:var(--l2)}
.lessoncard{text-align:left;align-items:stretch}
.lt{margin:0;font-size:1.3rem;text-wrap:balance}
.lb{margin:0;font-size:1.02rem;line-height:1.6;max-width:60ch}
.exs{display:flex;flex-direction:column;gap:8px;width:100%}
.ex{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"h r s" "h m s";align-items:center;gap:2px 14px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;transition:border-color .15s}
.ex.on{border-color:var(--c)}
.exh{grid-area:h;font-family:var(--hangul);font-size:1.6rem;font-weight:500}
.exr{grid-area:r;font-family:var(--mono);font-size:.9rem}
.exm{grid-area:m;color:var(--muted);font-size:.88rem}
.ex svg{grid-area:s;width:20px;height:20px;color:var(--muted)}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:64px;height:72px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--hangul);font-size:2.2rem}
.slot.filled{border-style:solid;border-color:var(--c)}
.slot.ok{border-color:var(--ok);color:var(--ok)} .slot.bad{border-color:var(--bad);color:var(--bad)}
.pieces{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.piece{min-width:58px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-family:var(--hangul);font-size:1.7rem}
.piece.wide{font-size:1.35rem}
.piece:disabled{opacity:.3}
.tform{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}
.tform input{width:100%;max-width:320px;font:inherit;font-family:var(--mono);font-size:1.2rem;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);text-align:center}
.tform input:focus{outline:none;border-color:var(--c)}
.num{font-family:var(--mono);font-weight:500}
.opts.small .opt{font-size:1.2rem}
.big-tr{font-size:1.3rem;text-wrap:balance}
.sline{min-height:56px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;border-bottom:2px solid var(--line);width:100%;padding-bottom:8px}
.sw{font-family:var(--hangul);font-size:1.5rem;background:var(--bg);border:1.5px solid var(--c);border-radius:10px;padding:4px 10px}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.scene{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px solid var(--line);border-left:6px solid var(--c);background:var(--bg);border-radius:12px;padding:12px 14px}
.scene .si{font-size:1.6rem}.scene small{color:var(--muted)}
.bubble{align-self:flex-start;max-width:100%;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--bg);border:1.5px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px}
.bh{font-family:var(--hangul);font-size:1.6rem}
.linkbtn{background:none;border:0;padding:0;color:var(--fg);text-decoration:underline;font-size:inherit}
.street{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;padding:8px 0}
.ssign{border:0;cursor:pointer;padding:12px 6px;min-width:0}
.ssign .big{font-size:clamp(1.3rem,5.5vw,2rem);overflow-wrap:anywhere}
.ssign.found{outline:4px solid var(--ok);outline-offset:3px}
.ssign.wrong{outline:4px solid var(--bad);outline-offset:3px;opacity:.7}
.rail{display:flex;align-items:center;gap:10px;width:100%;justify-content:space-between;font-family:var(--hangul)}
.rail .st{font-size:.95rem;color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere}
.rail .st.now{color:var(--fg);font-weight:700;text-align:left}
.rail .st:last-child{text-align:right}
.rail .train{font-size:1.6rem;animation:roll 1.2s ease-in-out infinite alternate}
@keyframes roll{to{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.rail .train{animation:none}}
@media (max-width:520px){.scenes{grid-template-columns:1fr}.street{grid-template-columns:repeat(2,1fr)}.stats b{font-size:1.2rem}}
/* ---------- visual layer ---------- */
:root{--car:#f7f8fa;--carline:#2b3137;--glass:#9cc6dd;--shadow:0 1px 2px rgba(23,32,42,.06),0 8px 24px -12px rgba(23,32,42,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--car:#dfe5ea;--carline:#0e1318;--glass:#5d8ea8;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--car:#dfe5ea;--carline:#0e1318;--glass:#5d8ea8;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6)}

/* hero */
.herobox{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--l4) 18%,var(--surface)) 0%,var(--surface) 70%);border:1px solid var(--line);box-shadow:var(--shadow);min-height:200px;display:flex;flex-direction:column;justify-content:flex-start}
.herobox .sky{position:absolute;inset:auto 0 0 0;width:100%;height:150px}
.herobox .city{fill:color-mix(in srgb,var(--fg) 9%,transparent)}
.herobox .hill{fill:color-mix(in srgb,var(--l2) 22%,transparent)}
.herobox .tower rect{fill:color-mix(in srgb,var(--fg) 30%,transparent)}
.herobox .rail{fill:none;stroke:var(--fg);stroke-width:3;opacity:.55}
.herobox .sleepers{fill:none;stroke:var(--fg);stroke-width:9;stroke-dasharray:1.5 8;opacity:.25}
.herotext{position:relative;padding:20px 20px 0;max-width:42ch}
.herotext h1{font-size:clamp(1.6rem,6vw,2.2rem);letter-spacing:-.02em}
.herotext .sub{margin-top:6px}
.sound{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;display:grid;place-items:center;right:max(12px,env(safe-area-inset-right,0px))}

/* cards, tools, stops */
.card,.line,.tool,.stats div,.review{box-shadow:var(--shadow)}
.card{animation:cardin .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardin{from{opacity:0;transform:translateY(10px) scale(.985)}}
.tool{transition:transform .18s,box-shadow .18s,border-color .18s}
.tool:hover:not(:disabled){transform:translateY(-2px)}
.tool .ti{transition:transform .25s}
.tool:hover:not(:disabled) .ti{transform:scale(1.12) rotate(-4deg)}
.line{animation:cardin .4s both}
.line:nth-of-type(2){animation-delay:.04s}.line:nth-of-type(3){animation-delay:.08s}.line:nth-of-type(4){animation-delay:.12s}.line:nth-of-type(5){animation-delay:.16s}
.stop .dot{transition:transform .2s}
.stop:hover .dot{transform:scale(1.12)}
.stop.next .dot{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.stop .mini{position:absolute;top:-14px;left:50%;width:58px;transform:translateX(-50%);z-index:1;animation:idle 1.4s ease-in-out infinite;pointer-events:none}
.stop .mini svg{width:58px;height:20px;display:block}
.track{padding-top:22px}
.tools #race{grid-column:1/-1}
@keyframes idle{50%{transform:translate(-50%,-2px)}}
.stats b{display:inline-block;animation:pop .5s both .1s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.opt,.piece,.chip,.btn,.speak{transition:transform .12s,background .15s,border-color .15s}
.opt:active:not(:disabled),.piece:active:not(:disabled),.btn:active:not(:disabled){transform:scale(.97)}
.opt.ok{animation:okpop .35s}
@keyframes okpop{50%{transform:scale(1.04)}}

/* progress as a metro line */
.bar .prog{display:none}
.mprog{position:relative;flex:1;height:30px;margin:0 30px 0 28px}
.mtrack{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--line)}
.mfill{position:absolute;left:0;top:20px;height:6px;border-radius:3px;background:var(--c);transition:width .7s cubic-bezier(.3,.7,.2,1)}
.mtrain{position:absolute;top:0;transform:translateX(-50%);width:56px;transition:left .7s cubic-bezier(.3,.7,.2,1)}
.mtrain svg{width:56px;height:19px;display:block}
.mtrain::after{content:"";position:absolute;left:4px;right:4px;bottom:-4px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--fg) 15%,transparent)}

/* round end: the train pulls in, the station sign appears */
.arrival{position:relative;width:100%;height:150px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.arrival .atrack{position:absolute;left:0;right:0;bottom:12px;height:5px;background:var(--fg);opacity:.35;border-radius:3px}
.arrival .atrain{position:absolute;bottom:16px;left:50%;width:220px;transform:translateX(-50%);animation:pullin 1.3s cubic-bezier(.15,.75,.25,1) both}
.arrival .atrain svg{width:220px;height:73px;display:block}
@keyframes pullin{from{transform:translateX(calc(-50% - 120vw))}}
.arrival .asign{position:absolute;top:0;left:50%;transform:translateX(-50%);animation:signin .5s 1.15s both}
.arrival .asign .sign{padding:6px 18px}
.arrival .asign .big{font-size:clamp(1.8rem,8vw,2.6rem)}
@keyframes signin{from{opacity:0;transform:translate(-50%,-14px)}}

/* confetti */
.confetti{position:fixed;z-index:50;font-family:var(--hangul);font-weight:700;font-size:1.1rem;pointer-events:none;animation:fly .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

/* race: train jumps to the next station on a correct answer */
.rail{position:relative}
.rail .train{font-size:0;width:64px}
.rail .train svg{width:64px;height:21px;display:block}
.rail.go .train{transform:translateX(90px);opacity:0;transition:transform .25s ease-in,opacity .25s}

@media (prefers-reduced-motion:reduce){

}

.ph{margin:0;width:100%;border-radius:12px;overflow:hidden;background:var(--line)}
.ph img{display:block;width:100%;max-height:52vh;object-fit:contain;background:#000}
.vid{width:100%;display:flex;flex-direction:column;gap:8px}
.vbtn{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;color:#c4302b;font-weight:600}

.vbtn small{color:var(--muted);font-weight:400}
.vframe{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.credits{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.85rem;color:var(--muted)}
.credits summary{cursor:pointer;font-weight:600;color:var(--fg)}
.credits ul{padding-left:18px;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.credits a{color:var(--fg);overflow-wrap:anywhere}

/* tiny synth: no audio files needed */
let AC=null;
function tone(f,t0,d,type="sine",vol=.09){
  if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  const t=AC.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}
}
const SFX={
  ok:()=>{tone(784,0,.18);tone(1175,.09,.28)},
  bad:()=>{tone(196,0,.22,"triangle",.08);tone(164,.1,.26,"triangle",.06)},
  arrive:()=>{[659,784,988,1319].forEach((f,i)=>tone(f,i*.16,.5,"sine",.07))},
  tap:()=>tone(1400,0,.05,"square",.02)
};

/* hangul confetti from an element */
function burst(el,n=16){
  if(REDUCED||!el)return;
  const r=el.getBoundingClientRect();const chars="가나다라마바사아자차카타파하좋아요!★";
  for(let i=0;i<n;i++){
    const s=document.createElement("span");s.className="confetti";s.textContent=chars[Math.random()*chars.length|0];
    const a=Math.random()*Math.PI*2,d=60+Math.random()*90;
    s.style.left=(r.left+r.width/2)+"px";s.style.top=(r.top+r.height/2)+"px";
    s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",(Math.sin(a)*d-40)+"px");
    s.style.setProperty("--rot",(Math.random()*120-60)+"deg");s.style.color=`var(${["--l1","--l2","--l3","--l4","--l5","--l8"][i%6]})`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}

/* one observer wires everything that the renderers produce */
new MutationObserver(muts=>{
  for(const m of muts){
    if(m.type==="attributes"){
      const el=m.target;if(el.id!=="fb")continue;
      if(el.classList.contains("ok")&&!el.dataset.fx){el.dataset.fx=1;SFX.ok();burst(el,12)}
      else if(el.classList.contains("bad")&&!el.dataset.fx){el.dataset.fx=1;SFX.bad()}
      continue;
    }
    m.addedNodes.forEach(n=>{
      if(n.nodeType!==1)return;
      n.querySelectorAll?.("[data-to]").forEach(el=>{
        const key=el.classList.contains("mtrain")?"left":"width";
        el.style[key]=el.dataset.from+"%";
        requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style[key]=el.dataset.to+"%"}));
      });
      if(n.querySelector?.(".arrival")){SFX.arrive();setTimeout(()=>burst(document.querySelector(".asign"),24),1300)}
      const snd=n.querySelector?.("#snd");if(snd)snd.onclick=()=>{S.mute=!S.mute;save();snd.textContent=S.mute?"🔇":"🔊";if(!S.mute)SFX.ok()};
    });
  }
}).observe(document.getElementById("app"),{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});

/* ---------- hangul math: syllable = 0xAC00 + (initial*21 + vowel)*28 + final ---------- */
const CHO=[..."ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ"];
const CHO_R=["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
const JUNG=[..."ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ"];
const JUNG_R=["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
const JONG=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JONG_R=["","k","k","k","n","n","n","t","l","k","m","l","l","l","p","l","m","p","p","t","t","ng","t","t","k","t","p","t"];
const isSyl=ch=>{const c=ch.charCodeAt(0);return c>=0xAC00&&c<=0xD7A3};
function decomp(ch){const c=ch.charCodeAt(0)-0xAC00;return{l:Math.floor(c/588),v:Math.floor(c%588/28),t:c%28}}
const compose=(l,v,t)=>String.fromCharCode(0xAC00+(l*21+v)*28+t);
const sylRoman=ch=>{const d=decomp(ch);return CHO_R[d.l]+JUNG_R[d.v]+JONG_R[d.t]};
const syllables=w=>[...w].filter(isSyl);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const SWAPS=[["eo","u"],["eo","o"],["o","u"],["u","eo"],["wo","wi"],["wi","wo"],["eu","u"],["ng","n"],["h",""]];
function fake(r,taken){for(const [a,b] of shuffle(SWAPS)){if(r.includes(a)){const f=r.replace(a,b);if(f&&!taken.has(f))return f}}return null}
function options(item,pool){
  const taken=new Set([item.r]);const out=[item.r];
  const f=fake(item.r,taken);if(f){out.push(f);taken.add(f)}
  for(const p of shuffle(pool)){if(out.length>=4)break;if(!taken.has(p.r)){out.push(p.r);taken.add(p.r)}}
  return shuffle(out);
}
/* look-alike Hangul: swap one vowel (ㅓ↔ㅗ↔ㅜ, ㅝ↔ㅟ…) or ㅇ↔ㅎ */
const VSWAP={4:[8,13],8:[4,13],13:[4,18],18:[13],14:[16],16:[14],9:[14],0:[4],6:[12],12:[6]};
function fakeSyl(s){
  const d=decomp(s);const alt=VSWAP[d.v];
  if(alt)return compose(d.l,alt[Math.random()*alt.length|0],d.t);
  if(d.l===11||d.l===18)return compose(d.l===11?18:11,d.v,d.t);
  return compose(d.l,d.v===20?18:20,d.t);
}
function fakeHangul(w){
  const s=[...w];const idx=shuffle(s.map((c,i)=>i).filter(i=>isSyl(s[i])));
  for(const i of idx){const f=fakeSyl(s[i]);if(f!==s[i]){s[i]=f;return s.join("")}}
  return null;
}
function hOptions(item,pool){
  const out=[item.h];const f=fakeHangul(item.h);if(f&&f!==item.h)out.push(f);
  for(const p of shuffle(pool)){if(out.length>=4)break;if(!out.includes(p.h))out.push(p.h)}
  return shuffle(out);
}

/* ---------- spaced repetition (Leitner boxes) + streak ---------- */
const K=it=>it.h+(it.img?"@"+it.img:"");
const BOX_WAIT=[0,10*60e3,8*3600e3,24*3600e3,3*24*3600e3,7*24*3600e3];

function allItems(){const m=new Map();LINES.forEach((Ln,li)=>Ln.rounds.forEach((R,ri)=>R.items.forEach(it=>{if(!m.has(K(it)))m.set(K(it),{...it,c:Ln.c,rid:rid(li,ri)})})));return m}

function grade(it,ok){
  const now=Date.now();const k=K(it);const s=S.srs[k]||{b:0,d:now};
  s.b=ok?Math.min(s.b+1,BOX_WAIT.length-1):0;s.d=now+(ok?BOX_WAIT[s.b]:0);
  S.srs[k]=s;
  if(ok){S.miss[k]&&(S.miss[k]=Math.max(0,S.miss[k]-1))}else S.miss[k]=(S.miss[k]||0)+1;
  const day=new Date().toISOString().slice(0,10);if(!S.days.includes(day)){S.days.push(day);S.days=S.days.slice(-60)}
  save();
}
function streak(){
  const set=new Set(S.days);let n=0;const d=new Date();
  if(!set.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}
  return n;
}

let L=null;
const multiSyl=it=>{const n=syllables(it.h).length;return n>=2&&n<=5};
function buildQueue(items){
  const q=items.map(it=>({...it,mode:it.ask==="pick"?"pick":it.choices?"mcq":"read"}));
  const plain=items.filter(it=>!it.img);
  if(HAS_TTS)shuffle(plain).slice(0,Math.ceil(plain.length/2)).forEach(it=>q.push({...it,mode:"listen"}));
  shuffle(plain.filter(multiSyl)).slice(0,3).forEach(it=>q.push({...it,mode:"build"}));

}
function startRound(li,ri){

     stage:"intro",learnI:0,queue:q,total:q.length,right:0,wrong:0,hw:R.hw,review:false,vid:R.vid};

function modeFor(it){
  if(it.ask==="pick")return"pick";if(it.choices)return"mcq";
  const b=(S.srs[K(it)]||{b:0}).b;if(it.img)return b>=2&&!it.q?"type":"read";
  const opts=["read"];if(HAS_TTS)opts.push("listen");
  if(b>=1&&multiSyl(it))opts.push("build");
  if(b>=2)opts.push("type","type");
  return opts[Math.random()*opts.length|0];
}
function startSRS(){

function startReview(){

/* build the word from shuffled syllables (+2 look-alike decoys) */
function quizBuild(it,bar){
  const target=syllables(it.h);
  const decoys=[];for(const s of shuffle(target)){const f=fakeSyl(s);if(!target.includes(f)&&!decoys.includes(f))decoys.push(f);if(decoys.length>=2)break}
  const tiles=shuffle(target.concat(decoys));const picked=[];
  app.innerHTML=`${bar}
   <div class="card" id="card"><span class="lbl">Kelimeyi kur</span>
    <div class="mean">${esc(it.m)}</div>

    <div class="pieces">${tiles.map((s,i)=>`<button class="piece" data-i="${i}">${s}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="undo">Geri al</button></div>
    <p class="fb" id="fb" aria-live="polite"></p><div id="after"></div></div>`;
  bindQuit();
  if(HAS_TTS){say(it.h);$("#ls").onclick=()=>say(it.h)}
  const slots=[...app.querySelectorAll(".slot")];
  const draw=()=>slots.forEach((s,i)=>{s.textContent=picked[i]?tiles[picked[i]]:"";s.classList.toggle("filled",!!picked[i]||picked[i]===0)});
  app.querySelectorAll(".piece").forEach(b=>b.onclick=()=>{
    if(b.disabled||picked.length>=target.length)return;
    picked.push(+b.dataset.i);b.disabled=true;say(tiles[+b.dataset.i],{rate:.8});draw();
    if(picked.length===target.length){
      app.querySelectorAll(".piece,#undo").forEach(x=>x.disabled=true);
      const ok=picked.map(i=>tiles[i]).join("")===target.join("");
      slots.forEach(s=>s.classList.add(ok?"ok":"bad"));
      setTimeout(()=>say(it.h),400);feedback(it,ok,`${it.h} · ${it.r}`);
    }
  });
  $("#undo").onclick=()=>{const i=picked.pop();if(i!==undefined)app.querySelector(`.piece[data-i="${i}"]`).disabled=false;draw()};
}

/* ---------- price game: generated prices, three directions ---------- */
const DIG=["","일","이","삼","사","오","육","칠","팔","구"];
const unitPart=(d,u)=>d===0?"":(d===1?u:DIG[d]+u);
function priceHangul(p){const m=Math.floor(p/10000),c=Math.floor(p%10000/1000),b=Math.floor(p%1000/100);
  return [m?unitPart(m,"만"):"",unitPart(c,"천")+unitPart(b,"백")].filter(Boolean).join(" ")+" 원"}
function priceParts(p){const m=Math.floor(p/10000),c=Math.floor(p%10000/1000),b=Math.floor(p%1000/100);const out=[];
  if(m)out.push(`${unitPart(m,"만")} = ${(m*10000).toLocaleString("tr-TR")}`);if(c)out.push(`${unitPart(c,"천")} = ${(c*1000).toLocaleString("tr-TR")}`);if(b)out.push(`${unitPart(b,"백")} = ${b*100}`);return out.join(" · ")}
const fmtW=p=>"₩"+p.toLocaleString("en-US");
function randPrice(){const m=[0,0,1,1,2,3,5][Math.random()*7|0],c=Math.random()*10|0,b=[0,0,5][Math.random()*3|0];const p=m*10000+c*1000+b*100;return p>=1000?p:randPrice()}
function pricePerturb(p){const alts=new Set();const m=Math.floor(p/10000),c=Math.floor(p%10000/1000),b=Math.floor(p%1000/100);
  const tries=[[m,(c+1)%10,b],[m,(c+9)%10,b],[m+1,c,b],[Math.max(0,m-1),c,b],[m,c,b?0:5],[c,m,b],[m,c,b]];
  for(const [a,x,y] of shuffle(tries)){const q=a*10000+x*1000+y*100;if(q!==p&&q>=1000)alts.add(q);if(alts.size>=3)break}
  while(alts.size<3){const q=randPrice();if(q!==p)alts.add(q)}return shuffle([p,...alts])}
let PG=null;
function priceGame(){setColor("--l6");PG={i:0,n:10,right:0};priceQ()}
function priceQ(){
  document.onkeydown=null;
  if(PG.i>=PG.n)return priceEnd();
  const p=randPrice();const kind=["toH","toN",HAS_TTS?"hear":"toN"][PG.i%3];const opts=pricePerturb(p);
  const prompt=kind==="toH"?`<div class="big long num">${fmtW(p)}</div><p class="q">Korece nasıl okunur?</p>`
    :kind==="toN"?`<div class="sign sign-menu"><span class="big long">${priceHangul(p)}</span></div><p class="q">Bu fiyat kaç won?</p>`
    :`<button class="bigspeak" id="ls">${SPK}</button><p class="q">Duyduğun fiyat hangisi?</p>`;
  app.innerHTML=`${topbar(PG.i,PG.n,"Fiyat oyunu")}
   <div class="card" id="card"><span class="lbl">Soru ${PG.i+1}/${PG.n}</span>${prompt}
    <div class="opts ${kind==="toH"?"hangul small":""}">${opts.map((o,i)=>`<button class="opt" data-v="${o}"><span class="k">${i+1}</span>${kind==="toH"?priceHangul(o):fmtW(o)}</button>`).join("")}</div>
    <p class="fb" id="fb" aria-live="polite"></p><div id="after"></div></div>`;
  bindQuit();
  if(kind==="hear"){say(priceHangul(p));$("#ls").onclick=()=>say(priceHangul(p))}
  const btns=[...app.querySelectorAll(".opt")];
  const pick=b=>{if(b.disabled)return;btns.forEach(x=>x.disabled=true);
    const ok=+b.dataset.v===p;btns.find(x=>+x.dataset.v===p).classList.add("ok");if(!ok){b.classList.add("bad");$("#card").classList.add("shake")}
    if(ok)PG.right++;say(priceHangul(p));
    $("#fb").className="fb "+(ok?"ok":"bad");$("#fb").textContent=(ok?"Doğru! ":"Doğrusu: ")+`${fmtW(p)} = ${priceHangul(p)}`;
    $("#after").innerHTML=`<p class="note">${priceParts(p)}</p><div class="row"><button class="btn" id="cont">Sonraki</button></div>`;
    $("#cont").onclick=()=>{PG.i++;priceQ()};$("#cont").focus();
    const day=new Date().toISOString().slice(0,10);if(!S.days.includes(day)){S.days.push(day);save()}};
  btns.forEach(b=>b.onclick=()=>pick(b));
  document.onkeydown=e=>{if(/^[1-4]$/.test(e.key)&&btns[e.key-1])pick(btns[e.key-1])};
}
function priceEnd(){
  app.innerHTML=`${topbar(1,1,"Fiyat oyunu")}<div class="card"><span class="lbl">Bitti</span><div class="mean">${PG.right}/${PG.n} doğru</div>
   <p class="note">İpucu: önce 만'dan önceki sayıya bak (onbinler), sonra 천 (binler), sonra 백 (yüzler). 1 için 일 söylenmez.</p>
   <div class="row"><button class="btn" id="again">Yeni 10 fiyat</button><button class="btn ghost" id="map">Haritaya dön</button></div></div>`;

/* ---------- sentence builder: noun × pattern combinations ---------- */
const NOUNS=[
 {h:"물",r:"mul",tr:"Su"},{h:"커피",r:"keo-pi",tr:"Kahve"},{h:"김밥",r:"gim-bap",tr:"Kimbap"},{h:"라면",r:"ra-myeon",tr:"Ramen"},
 {h:"맥주",r:"maek-ju",tr:"Bira"},{h:"이거",r:"i-geo",tr:"Bu",tr2:"Bunu"},{h:"영수증",r:"yeong-su-jeung",tr:"Fiş",tr2:"Fişi"},{h:"봉투",r:"bong-tu",tr:"Poşet"},
 {h:"화장실",r:"hwa-jang-sil",tr:"Tuvalet"},{h:"지하철역",r:"ji-ha-cheol-yeok",tr:"Metro istasyonu"},{h:"편의점",r:"pyeo-ni-jeom",tr:"Market"},{h:"출구",r:"chul-gu",tr:"Çıkış"},
 {h:"카드",r:"ka-deu",tr:"Kart"},{h:"명동",r:"myeong-dong",tr:"Myeongdong"},{h:"홍대",r:"hong-dae",tr:"Hongdae"}];
const PATTERNS=[
 {h:"주세요",r:"ju-se-yo",make:n=>`${n.tr2||n.tr} verin lütfen`,ok:["물","커피","김밥","라면","맥주","이거","영수증","봉투"]},
 {h:"있어요?",r:"i-sseo-yo",make:n=>`${n.tr} var mı?`,ok:["물","커피","김밥","라면","맥주","봉투","화장실","편의점"]},
 {h:"어디예요?",r:"eo-di-ye-yo",make:n=>`${n.tr} nerede?`,ok:["화장실","지하철역","편의점","출구"]},
 {h:"얼마예요?",r:"eol-ma-ye-yo",make:n=>`${n.tr} ne kadar?`,ok:["이거","커피","김밥","라면","맥주"]},
 {h:"돼요?",r:"dwae-yo",make:n=>`${n.tr} olur mu?`,ok:["카드"]},
 {h:"가 주세요",r:"ga ju-se-yo",make:n=>`${n.tr}'a gidin lütfen (taksi)`,ok:["명동","홍대"]},
 {h:"두 개 주세요",r:"du gae ju-se-yo",make:n=>`${n.tr2||n.tr}ndan iki tane lütfen`,ok:["이거"]}];
function makeSentence(){
  const p=PATTERNS[Math.random()*PATTERNS.length|0];const n=NOUNS.find(x=>x.h===shuffle(p.ok)[0]);
  const blocks=[n.h,...p.h.split(" ")];
  const dn=shuffle(NOUNS.filter(x=>x.h!==n.h))[0].h;const dp=shuffle(PATTERNS.filter(x=>x!==p))[0].h.split(" ").slice(-1)[0];
  return{tr:p.make(n),blocks,decoys:[dn,dp].filter(d=>!blocks.includes(d)),h:blocks.join(" "),r:`${n.r} ${p.r}`,noun:n,pat:p};
}
let SG=null;
function sentenceGame(){setColor("--l7");SG={i:0,n:8,right:0};sentQ()}
function sentQ(){
  document.onkeydown=null;
  if(SG.i>=SG.n)return sentEnd();
  const s=makeSentence();const tiles=shuffle(s.blocks.concat(s.decoys));const picked=[];
  app.innerHTML=`${topbar(SG.i,SG.n,"Cümle kur")}
   <div class="card" id="card"><span class="lbl">Cümle ${SG.i+1}/${SG.n}</span>
    <div class="mean big-tr">“${esc(s.tr)}”</div>
    <p class="tiny">Korece sıra Türkçe gibi: önce kelime, sonra kalıp. Fazladan iki parça var.</p>
    <div class="sline" id="sline"></div>
    <div class="pieces">${tiles.map((t,i)=>`<button class="piece wide" data-i="${i}">${esc(t)}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="undo">Geri al</button><button class="btn" id="check" disabled>Kontrol et</button></div>
    <p class="fb" id="fb" aria-live="polite"></p><div id="after"></div></div>`;
  bindQuit();
  const draw=()=>{$("#sline").innerHTML=picked.map(i=>`<span class="sw">${esc(tiles[i])}</span>`).join("")||`<span class="tiny">Parçalara dokun</span>`;$("#check").disabled=!picked.length};draw();
  app.querySelectorAll(".piece").forEach(b=>b.onclick=()=>{if(b.disabled)return;picked.push(+b.dataset.i);b.disabled=true;say(tiles[+b.dataset.i],{rate:.85});draw()});
  $("#undo").onclick=()=>{const i=picked.pop();if(i!==undefined)app.querySelector(`.piece[data-i="${i}"]`).disabled=false;draw()};
  $("#check").onclick=()=>{
    app.querySelectorAll(".piece,#undo,#check").forEach(x=>x.disabled=true);
    const ok=picked.map(i=>tiles[i]).join(" ")===s.h;if(ok)SG.right++;else $("#card").classList.add("shake");
    say(s.h);
    $("#fb").className="fb "+(ok?"ok":"bad");$("#fb").textContent=(ok?"Doğru! ":"Doğrusu: ")+s.h;
    $("#after").innerHTML=`<div class="roman">${esc(s.r)}</div><p class="note">${esc(s.noun.h)} = ${esc(s.noun.tr)} · ${esc(s.pat.h)} = kalıp. Aynı kalıbı başka kelimelerle de kullanabilirsin.</p>
      <div class="row"><button class="speak" id="rep">${SPK}Tekrar dinle</button><button class="btn" id="cont">Sonraki</button></div>`;
    $("#rep").onclick=()=>say(s.h,{rate:.7});$("#cont").onclick=()=>{SG.i++;sentQ()};$("#cont").focus();
    const day=new Date().toISOString().slice(0,10);if(!S.days.includes(day)){S.days.push(day);save()}
  };
}
function sentEnd(){
  app.innerHTML=`${topbar(1,1,"Cümle kur")}<div class="card"><span class="lbl">Bitti</span><div class="mean">${SG.right}/${SG.n} doğru</div>
   <p class="note">${NOUNS.length} kelime ve ${PATTERNS.length} kalıpla her seferinde farklı cümleler çıkar. Seul'de kalıbı ezbere bil, kelimeyi gösterip söyle.</p>

}

  {npc:["3번 출구로 나가세요.","sam-beon chul-gu-ro na-ga-se-yo","3 numaralı çıkıştan çıkın."],ask:"Ne dedi?",tr:[["3 numaralı çıkıştan çık",1],["3. hatta bin",0],["3 durak git",0]]},
  {npc:["환승은 2호선이에요.","hwan-seung-eun i-ho-seo-ni-e-yo","Aktarma 2. hatta."],ask:"Ne dedi?",tr:[["2. hatta aktarma yap",1],["2 numaralı çıkış",0],["2 dakika sonra",0]]}]}
];
let SC=null;
function sceneMenu(){
  setColor("--l1");document.onkeydown=null;
  const best=S.scenes||{};
  app.innerHTML=`${topbar(0,1,"Seul'de bir gün")}
   <div class="card"><span class="lbl">Bir yer seç</span>
    <p class="note">Karşındaki kişi Korece konuşacak (sesli). Önce dinle, sonra doğru cevabı seç. Her cevaptan sonra ne dendiğini ve neden doğru ya da yanlış olduğunu göreceksin.</p>
    <div class="scenes">${SCENES.map((s,i)=>`<button class="scene" data-i="${i}" style="--c:var(${s.c})"><span class="si">${s.icon}</span><b>${esc(s.name)}</b><small>${s.steps.length} adım${best[s.id]?` · en iyi ${best[s.id]}/${s.steps.length}`:""}</small></button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="map">Haritaya dön</button></div></div>`;
  bindQuit();$("#map").onclick=home;
  app.querySelectorAll(".scene").forEach(b=>b.onclick=()=>{const s=SCENES[+b.dataset.i];setColor(s.c);SC={s,i:0,right:0};sceneStep()});
}
function sceneStep(){
  document.onkeydown=null;
  const {s,i}=SC;if(i>=s.steps.length)return sceneEnd();
  const st=s.steps[i];const isKo=!!st.ko;const opts=shuffle(isKo?st.ko:st.tr);
  app.innerHTML=`${topbar(i,s.steps.length,s.icon+" "+s.name)}
   <div class="card" id="card">
    ${st.npc?`<div class="bubble npc"><button class="speak" id="np">${SPK}Dinle</button><span class="bh" id="nh" hidden>${esc(st.npc[0])}</span><span class="tiny" id="nhint">Önce sadece dinle. Gerekirse <button class="linkbtn" id="show">yazıyı göster</button>.</span></div>`:""}
    <p class="q">${esc(st.ask)}</p>
    <div class="opts ${isKo?"hangul small":""}">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span>${esc(o[0])}</button>`).join("")}</div>
    <p class="fb" id="fb" aria-live="polite"></p><div id="after"></div></div>`;
  bindQuit();
  if(st.npc){say(st.npc[0],{rate:.85});$("#np").onclick=()=>say(st.npc[0],{rate:.75});$("#show").onclick=()=>{$("#nh").hidden=false;$("#nhint").hidden=true}}
  const btns=[...app.querySelectorAll(".opt")];
  const pick=b=>{if(b.disabled)return;btns.forEach(x=>x.disabled=true);
    const o=opts[+b.dataset.k];const ok=!!o[1];
    btns.forEach((x,k)=>{if(opts[k][1])x.classList.add("ok")});if(!ok){b.classList.add("bad");$("#card").classList.add("shake")}else SC.right++;
    if(isKo)say(o[0]);
    if(st.npc){$("#nh").hidden=false;const h=$("#nhint");if(h)h.hidden=true}
    $("#fb").className="fb "+(ok?"ok":"bad");$("#fb").textContent=ok?"Doğru!":"Olmadı.";
    const why=isKo?(o[2]||""):"";const right=opts.find(x=>x[1]);
    $("#after").innerHTML=`${st.npc?`<p class="note"><b>${esc(st.npc[0])}</b> · ${esc(st.npc[1])}<br>= ${esc(st.npc[2])}</p>`:""}
      ${why?`<p class="note">${esc(why)}</p>`:""}${!ok&&isKo?`<p class="note">Doğrusu: <b>${esc(right[0])}</b>. ${esc(right[2]||"")}</p>`:""}
      <div class="row"><button class="btn" id="cont">Devam</button></div>`;
    $("#cont").onclick=()=>{SC.i++;sceneStep()};$("#cont").focus();
    const day=new Date().toISOString().slice(0,10);if(!S.days.includes(day)){S.days.push(day);save()}};
  btns.forEach(b=>b.onclick=()=>pick(b));
  document.onkeydown=e=>{if(/^[1-3]$/.test(e.key)&&btns[e.key-1])pick(btns[e.key-1])};
}
function sceneEnd(){
  const {s,right}=SC;S.scenes=S.scenes||{};S.scenes[s.id]=Math.max(S.scenes[s.id]||0,right);save();
  const lines=s.steps.filter(x=>x.npc).map(x=>x.npc);const mine=s.steps.filter(x=>x.ko).map(x=>x.ko.find(o=>o[1]));
  app.innerHTML=`${topbar(1,1,s.icon+" "+s.name)}
   <div class="card"><span class="lbl">Sahne bitti</span><div class="mean">${right}/${s.steps.length} doğru</div>
    <p class="note">Bu sahnenin kısa sözlüğü. Satıra dokununca okunur:</p>
    <div class="exs">${lines.map(([h,r,m])=>`<button class="ex" data-h="${esc(h)}"><span class="exh">${esc(h)}</span><span class="exr">${esc(r)}</span><span class="exm">duyacağın: ${esc(m)}</span>${SPK}</button>`).join("")}
      ${mine.map(o=>`<button class="ex" data-h="${esc(o[0])}"><span class="exh">${esc(o[0])}</span><span class="exm">söyleyeceğin · ${esc(o[2]||"")}</span>${SPK}</button>`).join("")}</div>
    <div class="row"><button class="btn" id="again">Tekrar oyna</button><button class="btn ghost" id="menu">Başka sahne</button></div></div>`;
  bindQuit();app.querySelectorAll(".ex").forEach(b=>b.onclick=()=>{flash(b);say(b.dataset.h,{rate:.75})});
  $("#again").onclick=()=>{SC={s,i:0,right:0};sceneStep()};$("#menu").onclick=sceneMenu;
}

/* ---------- "Tabela avı": find the sign on a busy street ---------- */
const PLACES=[
 {h:"화장실",r:"hwa-jang-sil",tr:"Tuvalet"},{h:"약국",r:"yak-guk",tr:"Eczane"},{h:"병원",r:"byeong-won",tr:"Hastane"},
 {h:"은행",r:"eun-haeng",tr:"Banka"},{h:"환전",r:"hwan-jeon",tr:"Döviz bürosu"},{h:"편의점",r:"pyeo-ni-jeom",tr:"Market"},
 {h:"식당",r:"sik-dang",tr:"Lokanta"},{h:"카페",r:"ka-pe",tr:"Kafe"},{h:"출구",r:"chul-gu",tr:"Çıkış"},{h:"입구",r:"ip-gu",tr:"Giriş"},
 {h:"지하철",r:"ji-ha-cheol",tr:"Metro"},{h:"면세점",r:"myeon-se-jeom",tr:"Duty free mağaza"},{h:"경찰서",r:"gyeong-chal-seo",tr:"Karakol"},
 {h:"분식",r:"bun-sik",tr:"Atıştırmalık lokantası (tteokbokki, kimbap)"},{h:"호텔",r:"ho-tel",tr:"Otel"},{h:"노래방",r:"no-rae-bang",tr:"Karaoke"}];
let HG=null;
function huntGame(){setColor("--l8");HG={i:0,n:10,right:0,t0:Date.now()};huntQ()}
function huntQ(){
  document.onkeydown=null;
  if(HG.i>=HG.n)return huntEnd();
  const target=PLACES[Math.random()*PLACES.length|0];
  const others=shuffle(PLACES.filter(p=>p!==target)).slice(0,5);
  const signs=shuffle([target,...others]);
  const styles=["metro","store","menu","serif","poster"];
  app.innerHTML=`${topbar(HG.i,HG.n,"Tabela avı")}
   <div class="card" id="card"><span class="lbl">Bul · ${HG.i+1}/${HG.n}</span>
    <div class="mean big-tr">${esc(target.tr)} nerede?</div>
    <div class="street">${signs.map((p,k)=>`<button class="ssign sign sign-${styles[(k+HG.i)%styles.length]}" data-h="${esc(p.h)}" style="transform:rotate(${(Math.random()*6-3).toFixed(1)}deg)"><span class="big">${esc(p.h)}</span></button>`).join("")}</div>
    <p class="fb" id="fb" aria-live="polite"></p><div id="after"></div></div>`;
  bindQuit();
  const btns=[...app.querySelectorAll(".ssign")];
  btns.forEach(b=>b.onclick=()=>{if(b.disabled)return;btns.forEach(x=>x.disabled=true);
    const ok=b.dataset.h===target.h;if(ok)HG.right++;else $("#card").classList.add("shake");
    btns.find(x=>x.dataset.h===target.h).classList.add("found");if(!ok)b.classList.add("wrong");
    say(target.h);
    $("#fb").className="fb "+(ok?"ok":"bad");$("#fb").textContent=`${ok?"Buldun!":"O değil."} ${target.h} · ${target.r} = ${target.tr}`;
    $("#after").innerHTML=`${ok?"":`<p class="note">Dokunduğun: ${esc(b.dataset.h)} = ${esc((PLACES.find(p=>p.h===b.dataset.h)||{}).tr||"")}</p>`}<div class="row"><button class="btn" id="cont">Sonraki</button></div>`;
    $("#cont").onclick=()=>{HG.i++;huntQ()};$("#cont").focus()});
}
function huntEnd(){
  const sec=Math.round((Date.now()-HG.t0)/1000);
  app.innerHTML=`${topbar(1,1,"Tabela avı")}<div class="card"><span class="lbl">Av bitti</span><div class="mean">${HG.right}/${HG.n} doğru · ${sec} saniye</div>
   <p class="note">Bu tabelaları Seul'de gerçekten göreceksin. En önemlileri: 화장실 (tuvalet), 약국 (eczane), 환전 (döviz), 출구 (çıkış).</p>
   <div class="row"><button class="btn" id="again">Tekrar</button><button class="btn ghost" id="map">Haritaya dön</button></div></div>`;
  bindQuit();$("#again").onclick=huntGame;$("#map").onclick=home;
}

/* ---------- "Metro yarışı": 60-second sprint along Line 2 ---------- */
const LINE2=["시청","을지로입구","을지로3가","을지로4가","동대문역사문화공원","신당","상왕십리","왕십리","한양대","뚝섬","성수","건대입구","구의","강변","잠실나루","잠실","잠실새내","종합운동장","삼성","선릉","역삼","강남","교대","서초","방배","사당","낙성대","서울대입구","봉천","신림","신대방","구로디지털단지","대림","신도림","문래","영등포구청","당산","합정","홍대입구","신촌","이대","아현","충정로"];
let RG=null;
function raceGame(){
  setColor("--l2");
  let pool=[...ITEMS.values()].filter(it=>S.srs[K(it)]&&!it.img&&!it.choices);if(pool.length<8)pool=[...ITEMS.values()].filter(it=>!it.img&&!it.choices&&!it.h.includes(" ")&&syllables(it.h).length<=4);
  RG={pool,pos:0,wrong:0,end:Date.now()+60e3,timer:null};raceQ();
  RG.timer=setInterval(()=>{const left=Math.max(0,Math.ceil((RG.end-Date.now())/1000));const t=$("#rt");if(t)t.textContent=left+" sn";if(left<=0){clearInterval(RG.timer);raceEnd()}},250);
}
function raceQ(){
  if(Date.now()>=RG.end)return;
  const it=RG.pool[Math.random()*RG.pool.length|0];const opts=options(it,RG.pool).slice(0,3);if(!opts.includes(it.r))opts[0]=it.r;
  const o=shuffle(opts);const st=LINE2[RG.pos%LINE2.length],nx=LINE2[(RG.pos+1)%LINE2.length];
  app.innerHTML=`<div class="bar"><button class="x" id="quit" aria-label="Haritaya dön">×</button><div class="prog"><i style="width:${Math.min(100,RG.pos/LINE2.length*100)}%"></i></div><span class="lbl" id="rt">${Math.ceil((RG.end-Date.now())/1000)} sn</span></div>
   <div class="card race" id="card">
    <div class="rail"><span class="st now">${esc(st)}</span><span class="train">${TRAIN}</span><span class="st">${esc(nx)}</span></div>
    <span class="lbl">${RG.pos} durak · hızlı oku</span>
    <div class="big ${it.h.length>3?"long":""}">${esc(it.h)}</div>
    <div class="opts">${o.map((x,k)=>`<button class="opt" data-v="${esc(x)}"><span class="k">${k+1}</span>${esc(x)}</button>`).join("")}</div></div>`;
  $("#quit").onclick=()=>{clearInterval(RG.timer);home()};
  const btns=[...app.querySelectorAll(".opt")];
  const pick=b=>{if(b.disabled||Date.now()>=RG.end)return;btns.forEach(x=>x.disabled=true);
    const ok=b.dataset.v===it.r;
    if(ok){RG.pos++;b.classList.add("ok");grade(it,true);$("#card .rail")?.classList.add("go");SFX.ok();setTimeout(raceQ,280)}
    else{RG.wrong++;SFX.bad();b.classList.add("bad");btns.find(x=>x.dataset.v===it.r).classList.add("ok");grade(it,false);$("#card").classList.add("shake");say(it.h);setTimeout(raceQ,1100)}};
  btns.forEach(b=>b.onclick=()=>pick(b));
  document.onkeydown=e=>{if(/^[1-3]$/.test(e.key)&&btns[e.key-1])pick(btns[e.key-1])};
}
function raceEnd(){
  document.onkeydown=null;
  const best=Math.max(S.best||0,RG.pos);const rec=RG.pos>(S.best||0);S.best=best;save();
  app.innerHTML=`${topbar(1,1,"Metro yarışı")}<div class="card"><span class="lbl">Süre doldu</span>
   <div class="mean">${RG.pos} durak ilerledin${rec?" · yeni rekor! 🎉":""}</div>
   <p class="note">${esc(LINE2[0])} → ${esc(LINE2[Math.min(RG.pos,LINE2.length-1)])} (2. hat). ${RG.wrong} yanlış. Rekorun: ${best} durak. Durak adları da gerçek 2. hat istasyonları; 홍대입구 ve 강남'a kadar gidebilir misin?</p>
   <div class="row"><button class="btn" id="again">Tekrar yarış</button><button class="btn ghost" id="map">Haritaya dön</button></div></div>`;
  $("#again").onclick=raceGame;$("#map").onclick=home;
}
</script>
